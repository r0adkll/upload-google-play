# This is a basic workflow to help you get started with Actions

name: PR Validation

# Controls when the workflow will run
on:
  # Triggers the workflow on push or pull request events but only for the "master" branch
  push:
    branches: [ "master" ]
  pull_request:
    branches: [ "master" ]
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v6

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '24'

      # Set up NPM and deps
      - name: Set up NPM
        run: npm ci

      # Do a build
      - name: Run Build
        run: npm run build

      # Check whether the compiled library changed
      - name: Check Build Updated
        uses: tj-actions/verify-changed-files@v20
        id: verify-built-lib
        with:
          files: lib/index.js

      # If it did change, the authro forgot to build. Fail the action
      - name: Verify Build Updated
        if: steps.verify-built-lib.outputs.files_changed == 'true'
        run: exit 1

      # On push / workflow_dispatch there is no PR diff, just run the tests
      - name: Run Tests
        if: github.event_name != 'pull_request'
        run: npm test

      # On PRs, figure out which source files changed so we can scope coverage
      # collection (and the threshold gate) to just those files
      - name: Get changed source files
        if: github.event_name == 'pull_request'
        id: changed
        uses: tj-actions/changed-files@v45
        with:
          files: src/**/*.ts
          separator: ','

      - name: Run Tests with Coverage (changed files)
        if: github.event_name == 'pull_request' && steps.changed.outputs.any_changed == 'true'
        env:
          CHANGED: ${{ steps.changed.outputs.all_changed_files }}
        run: |
          COVERAGE_ARGS=$(echo "$CHANGED" | tr ',' '\n' | sed 's|^|--collectCoverageFrom=|' | tr '\n' ' ')
          npx jest --coverage $COVERAGE_ARGS | tee ./coverage.txt

      - name: Run Tests (no source changes)
        if: github.event_name == 'pull_request' && steps.changed.outputs.any_changed != 'true'
        run: npm test

      - name: Post Coverage Comment
        id: coverage
        if: github.event_name == 'pull_request' && steps.changed.outputs.any_changed == 'true'
        uses: MishaKav/jest-coverage-comment@v1.0.29
        with:
          title: Code Coverage (changed files)
          coverage-summary-path: ./coverage/coverage-summary.json
          coverage-path: ./coverage.txt

      - name: Fail if coverage too low
        if: ${{ github.event_name == 'pull_request' && steps.changed.outputs.any_changed == 'true' && steps.coverage.outputs.coverage < 80 }}
        run: |
          echo "Coverage for changed files is below 80%!"
          exit 1
